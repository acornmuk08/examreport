<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모의고사 오답 분석 및 통계 시스템</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg-color: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-main: #1E293B;
            --text-sub: #64748B;
            --border-color: #E2E8F0;
            --accent-red: #EF4444;
            --accent-green: #10B981;
            --accent-amber: #F59E0B;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 24px 16px;
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            background: linear-gradient(135deg, #4F46E5 0%, #3B82F6 100%);
            color: white;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.2);
        }

        header h1 {
            font-size: 1.6rem;
            font-weight: 700;
        }

        header p {
            font-size: 0.95rem;
            opacity: 0.9;
            margin-top: 4px;
        }

        .status-badge {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #10B981;
        }

        .status-dot.offline {
            background-color: #F59E0B;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 24px;
        }

        @media (max-width: 950px) {
            .grid-layout {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border: 1px solid var(--border-color);
            margin-bottom: 24px;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--text-main);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 12px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-weight: 600;
            font-size: 0.88rem;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .form-control, select, input[type="text"], input[type="date"], input[type="number"], textarea {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.9rem;
            color: var(--text-main);
            background-color: #FAFAFA;
            transition: all 0.2s;
        }

        .form-control:focus, select:focus, input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .slider-container input[type="range"] {
            flex: 1;
            height: 8px;
            border-radius: 4px;
            background: #E2E8F0;
            outline: none;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .score-badge {
            min-width: 60px;
            text-align: center;
            padding: 6px 12px;
            background-color: var(--primary);
            color: white;
            font-weight: 700;
            border-radius: 8px;
            font-size: 1.05rem;
        }

        .row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .section-header {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--primary);
            margin: 20px 0 12px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 6px;
            border-bottom: 1px dashed var(--border-color);
        }

        .q-item-card {
            background-color: #F8FAFC;
            border: 1px solid #E2E8F0;
            border-left: 4px solid var(--primary);
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 12px;
            position: relative;
        }

        .q-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-sub);
        }

        .btn-remove-q {
            background: #FEE2E2;
            color: var(--accent-red);
            border: none;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-add-q {
            background-color: #EEF2FF;
            color: var(--primary);
            border: 1px dashed var(--primary);
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 16px;
        }

        .btn-add-q:hover {
            background-color: #E0E7FF;
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .status-msg {
            margin-top: 12px;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.88rem;
            display: none;
            text-align: center;
            font-weight: 500;
        }

        .status-success {
            background-color: #DEF7EC;
            color: #03543F;
        }

        .status-error {
            background-color: #FDE8E8;
            color: #9B1C1C;
        }

        .status-info {
            background-color: #E1EFFE;
            color: #1E429F;
        }

        .stats-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: #F1F5F9;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-card .val {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary);
        }

        .stat-card .lbl {
            font-size: 0.78rem;
            color: var(--text-sub);
            margin-top: 4px;
        }

        .chart-box {
            position: relative;
            height: 230px;
            margin-bottom: 20px;
        }

        .table-responsive {
            overflow-x: auto;
            max-height: 400px;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.83rem;
            text-align: left;
        }

        th {
            background-color: #F1F5F9;
            padding: 10px 12px;
            font-weight: 600;
            color: var(--text-sub);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
        }

        tr:hover {
            background-color: #F8FAFC;
        }

        .tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            background-color: #E0E7FF;
            color: #3730A3;
        }

        .btn-delete {
            background: none;
            border: none;
            color: var(--accent-red);
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>✏️ 수험생 오답 분석 & 모의고사 통계</h1>
            <p>한 시험 내 여러 오답 일괄 등록 및 구글 시트 연동 시스템</p>
        </div>
        <div class="status-badge" id="syncStatusBadge">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusBadgeText">시트 연동 대기중</span>
        </div>
    </header>

    <div class="grid-layout">
        <!-- 왼쪽: 피드백 입력 폼 -->
        <div class="card">
            <div class="card-title">📝 시험 및 오답 데이터 입력</div>
            <form id="feedbackForm">
                <!-- 1. 시험 공통 정보 -->
                <div class="row-2">
                    <div class="form-group">
                        <label class="form-label" for="date">날짜</label>
                        <input type="date" id="date" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="subject">과목</label>
                        <select id="subject" onchange="handleSubjectChange()" required>
                            <option value="국어">국어</option>
                            <option value="수학">수학</option>
                            <option value="영어">영어</option>
                            <option value="한국사">한국사</option>
                            <option value="한국지리">한국지리</option>
                            <option value="세계지리">세계지리</option>
                            <option value="중국어">중국어</option>
                        </select>
                    </div>
                </div>

                <div class="row-2">
                    <div class="form-group">
                        <label class="form-label" for="examName">시험명</label>
                        <select id="examName" onchange="handleExamNameChange()" required>
                            <option value="6모">6모</option>
                            <option value="학평">학평</option>
                            <option value="더프">더프</option>
                            <option value="서프">서프</option>
                            <option value="종로">종로</option>
                            <option value="서바이벌">서바이벌</option>
                            <option value="전국서바이벌">전국서바이벌</option>
                            <option value="서바이벌리부트">서바이벌리부트</option>
                            <option value="브릿지">브릿지</option>
                            <option value="전국브릿지">전국브릿지</option>
                            <option value="direct">직접입력</option>
                        </select>
                        <input type="text" id="examNameDirect" placeholder="시험명 입력" style="display:none; margin-top:6px;">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="round">회차</label>
                        <input type="number" id="round" min="1" max="100" value="1" placeholder="예: 1회차" required>
                    </div>
                </div>

                <div class="row-2">
                    <div class="form-group">
                        <label class="form-label" for="score">점수 (슬라이더)</label>
                        <div class="slider-container">
                            <input type="range" id="score" min="0" max="100" value="80" oninput="updateScoreValue(this.value)">
                            <div class="score-badge" id="scoreBadge">80점</div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="grade">등급 (선택)</label>
                        <input type="text" id="grade" placeholder="예: 1등급">
                    </div>
                </div>

                <!-- 2. 틀린 문항 목록 (동적 추가 구역) -->
                <div class="section-header">
                    <span>❌ 틀린 문항 목록</span>
                </div>

                <div id="qListContainer">
                    <!-- Dynamic Q items appended here -->
                </div>

                <button type="button" class="btn-add-q" onclick="addQuestionBlock()">➕ 틀린 문항 추가하기</button>

                <button type="submit" class="btn-submit">🚀 전체 오답 제출 & 스프레드시트 저장</button>
                <div id="statusMsg" class="status-msg"></div>
            </form>
        </div>

        <!-- 오른쪽: 실시간 통계 및 분석 차트 -->
        <div>
            <div class="card">
                <div class="card-title">📊 실전 모의고사 요약 & 차트</div>
                <div class="stats-summary">
                    <div class="stat-card">
                        <div class="val" id="statTotalExams">0</div>
                        <div class="lbl">총 오답 문항 수</div>
                    </div>
                    <div class="stat-card">
                        <div class="val" id="statAvgScore">0점</div>
                        <div class="lbl">전체 평균 점수</div>
                    </div>
                    <div class="stat-card">
                        <div class="val" id="statTopCause">-</div>
                        <div class="lbl">최다 오답 원인</div>
                    </div>
                </div>

                <div class="chart-box">
                    <canvas id="causeChart"></canvas>
                </div>
            </div>

            <div class="card">
                <div class="card-title">📈 과목별 평균 점수</div>
                <div class="chart-box">
                    <canvas id="subjectChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- 하단: 최근 데이터 테이블 -->
    <div class="card">
        <div class="card-title">
            <span>📋 최근 오답 기록 목록 (로컬 저장소)</span>
            <button onclick="clearLocalHistory()" style="background:#EF4444; color:white; border:none; padding:4px 10px; border-radius:6px; font-size:0.8rem; cursor:pointer;">목록 초기화</button>
        </div>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>날짜</th>
                        <th>과목</th>
                        <th>시험명</th>
                        <th>회차</th>
                        <th>점수</th>
                        <th>틀린번호</th>
                        <th>문항유형</th>
                        <th>오답원인</th>
                        <th>상세분석</th>
                        <th>등급</th>
                        <th>삭제</th>
                    </tr>
                </thead>
                <tbody id="historyTableBody">
                    <tr><td colspan="11" style="text-align:center; color:var(--text-sub);">저장된 오답 기록이 없습니다.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // =========================================================================
        // 🔗 [설정] 구글 앱스 스크립트 웹앱 URL을 아래 큰따옴표("") 안에 붙여넣으세요.
        // =========================================================================
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyD-hYE6cDZqKkJjvLQo_Vou6cJZ8UaSsDVA7rXmckgVPVtTjgjSRTMLrF7cKnIIbZYxw/exec";

        // 과목별 문제 유형 데이터 정의
        const qTypesBySubject = {
            "국어": ["언어", "매체", "독서론", "독서-내용일치", "독서-내용추론", "독서-보기문제", "독서-어휘", "문학-표현상의특징", "문학-내용일치", "문학-내용추론", "문학-외적준거", "direct"],
            "수학": ["계산", "수1-각변환", "수1-삼각함수", "수1-삼각함수활용", "수1-지수로그", "수1-지수로그-그래프", "수1-수열", "수2-극한", "수2-그래프개형추론", "미적-급수", "미적-계산", "미적-음함수/매개변수", "미적-합성함수", "미적-적분", "direct"],
            "영어": ["듣기", "18-19", "주제-제목-요지", "단어", "흐름(35)", "빈칸", "순서", "삽입", "틀말유", "문법", "direct"],
            "한국사": ["direct"],
            "한국지리": ["direct"],
            "세계지리": ["direct"],
            "중국어": ["direct"]
        };

        let qBlockCount = 0;
        let errorHistory = JSON.parse(localStorage.getItem('errorHistory') || '[]');
        let causeChartInstance = null;
        let subjectChartInstance = null;

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('date').valueAsDate = new Date();
            checkGasUrlStatus();
            addQuestionBlock(); // 기본 1개 문항 블록 생성
            renderHistory();
            renderCharts();
        });

        function checkGasUrlStatus() {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusBadgeText');
            if (GAS_WEB_APP_URL && !GAS_WEB_APP_URL.includes("여기에_구글_앱스_스크립트_URL")) {
                dot.classList.remove('offline');
                text.innerText = "구글 시트 연동됨";
            } else {
                dot.classList.add('offline');
                text.innerText = "로컬 단독 모드";
            }
        }

        function updateScoreValue(val) {
            document.getElementById('scoreBadge').innerText = val + '점';
        }

        function handleExamNameChange() {
            const val = document.getElementById('examName').value;
            const directInput = document.getElementById('examNameDirect');
            directInput.style.display = (val === 'direct') ? 'block' : 'none';
            directInput.required = (val === 'direct');
        }

        function handleSubjectChange() {
            // 과목 변경 시 기존 문항 블록들의 유형 드롭다운 갱신
            document.querySelectorAll('.q-item-card').forEach(card => {
                const qTypeSelect = card.querySelector('.q-type-select');
                const currentVal = qTypeSelect.value;
                populateQTypes(qTypeSelect);
            });
        }

        function populateQTypes(selectEl) {
            const subject = document.getElementById('subject').value;
            const types = qTypesBySubject[subject] || ["direct"];
            selectEl.innerHTML = '';
            types.forEach(t => {
                const opt = document.createElement('option');
                opt.value = t;
                opt.innerText = (t === 'direct') ? '직접입력' : t;
                selectEl.appendChild(opt);
            });
        }

        // 틀린 문항 블록 추가
        function addQuestionBlock() {
            qBlockCount++;
            const container = document.getElementById('qListContainer');
            const card = document.createElement('div');
            card.className = 'q-item-card';
            card.id = `qBlock_${qBlockCount}`;

            card.innerHTML = `
                <div class="q-item-header">
                    <span>문항 #${qBlockCount}</span>
                    ${qBlockCount > 1 ? `<button type="button" class="btn-remove-q" onclick="removeQuestionBlock('qBlock_${qBlockCount}')">삭제</button>` : ''}
                </div>
                <div class="row-2">
                    <div class="form-group">
                        <label class="form-label">틀린 문항 번호</label>
                        <input type="text" class="q-num-input" placeholder="예: 14" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">오답 원인</label>
                        <select class="q-cause-select" required>
                            <option value="개념 미숙">개념 미숙</option>
                            <option value="계산/실수">계산/실수</option>
                            <option value="시간 부족">시간 부족</option>
                            <option value="조건/발문 독해 오류">조건/발문 독해 오류</option>
                            <option value="스킬/아이디어 미착상">스킬/아이디어 미착상</option>
                            <option value="찍음/운">찍음/운</option>
                            <option value="기타">기타</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">틀린 문항 유형</label>
                    <select class="q-type-select" onchange="toggleDirectType(this)">
                    </select>
                    <input type="text" class="q-type-direct" placeholder="문항 유형 직접 입력" style="display:none; margin-top:6px;">
                </div>
                <div class="form-group" style="margin-bottom:0;">
                    <label class="form-label">상세 분석 (선택)</label>
                    <textarea class="q-detail-textarea" rows="2" placeholder="어떤 생각이 잘못되었는지 복습 기록"></textarea>
                </div>
            `;

            container.appendChild(card);
            populateQTypes(card.querySelector('.q-type-select'));
        }

        function removeQuestionBlock(blockId) {
            const el = document.getElementById(blockId);
            if (el) el.remove();
        }

        function toggleDirectType(selectEl) {
            const directInput = selectEl.parentElement.querySelector('.q-type-direct');
            if (selectEl.value === 'direct') {
                directInput.style.display = 'block';
                directInput.required = true;
            } else {
                directInput.style.display = 'none';
                directInput.required = false;
            }
        }

        function showStatus(msg, type) {
            const el = document.getElementById('statusMsg');
            el.innerText = msg;
            el.className = 'status-msg status-' + type;
            el.style.display = 'block';
            setTimeout(() => { if(type !== 'info') el.style.display = 'none'; }, 5000);
        }

        // 폼 제출 (여러 문항 생성 후 일괄 전송)
        document.getElementById('feedbackForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            // 1. 공통 시험 정보
            const date = document.getElementById('date').value;
            const subject = document.getElementById('subject').value;
            const examSelect = document.getElementById('examName').value;
            const examName = (examSelect === 'direct') ? document.getElementById('examNameDirect').value : examSelect;
            const round = document.getElementById('round').value + '회차';
            const score = document.getElementById('score').value;
            const grade = document.getElementById('grade').value;

            // 2. 문항별 정보 수집 (배열 생성)
            const qCards = document.querySelectorAll('.q-item-card');
            const newEntries = [];

            qCards.forEach(card => {
                const qNum = card.querySelector('.q-num-input').value;
                const qTypeSelect = card.querySelector('.q-type-select').value;
                const qType = (qTypeSelect === 'direct') ? card.querySelector('.q-type-direct').value : qTypeSelect;
                const cause = card.querySelector('.q-cause-select').value;
                const detail = card.querySelector('.q-detail-textarea').value;

                newEntries.push({
                    date,
                    subject,
                    examName,
                    round,
                    score: Number(score),
                    qNum,
                    qType,
                    cause,
                    detail,
                    grade
                });
            });

            // 3. 로컬 저장 (역순으로 들어가지 않게 추가)
            errorHistory.unshift(...newEntries);
            localStorage.setItem('errorHistory', JSON.stringify(errorHistory));
            renderHistory();
            renderCharts();

            // 4. 구글 시트 전송 (배열 데이터 전송)
            if (GAS_WEB_APP_URL && !GAS_WEB_APP_URL.includes("여기에_구글_앱스_스크립트_URL")) {
                showStatus(`${newEntries.length}개 오답 데이터를 스프레드시트에 전송 중...`, 'info');
                try {
                    await fetch(GAS_WEB_APP_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(newEntries)
                    });
                    showStatus(`✅ ${newEntries.length}개의 오답 기록이 저장 및 연동되었습니다!`, 'success');
                } catch (err) {
                    console.error(err);
                    showStatus('⚠️ 로컬에는 저장되었으나, 스프레드시트 전송에 실패했습니다.', 'error');
                }
            } else {
                showStatus(`✅ ${newEntries.length}개 오답 기록이 로컬에 저장되었습니다.`, 'success');
            }

            // 초기화: 문항 블록 1개만 남김
            document.getElementById('qListContainer').innerHTML = '';
            qBlockCount = 0;
            addQuestionBlock();
        });

        function renderHistory() {
            const tbody = document.getElementById('historyTableBody');
            if (errorHistory.length === 0) {
                tbody.innerHTML = '<tr><td colspan="11" style="text-align:center; color:var(--text-sub);">저장된 오답 기록이 없습니다.</td></tr>';
                return;
            }

            tbody.innerHTML = errorHistory.map((item, idx) => `
                <tr>
                    <td>${item.date}</td>
                    <td><span class="tag">${item.subject}</span></td>
                    <td>${item.examName}</td>
                    <td>${item.round}</td>
                    <td><b>${item.score}점</b></td>
                    <td><b>${item.qNum}번</b></td>
                    <td>${item.qType}</td>
                    <td><span style="color:${getCauseColor(item.cause)}; font-weight:600;">${item.cause}</span></td>
                    <td>${item.detail || '-'}</td>
                    <td>${item.grade || '-'}</td>
                    <td><button class="btn-delete" onclick="deleteItem(${idx})">✕</button></td>
                </tr>
            `).join('');
        }

        function getCauseColor(cause) {
            switch(cause) {
                case '개념 미숙': return '#EF4444';
                case '계산/실수': return '#F59E0B';
                case '시간 부족': return '#3B82F6';
                default: return '#6B7280';
            }
        }

        function deleteItem(idx) {
            if(confirm('이 오답 기록을 삭제하시겠습니까?')) {
                errorHistory.splice(idx, 1);
                localStorage.setItem('errorHistory', JSON.stringify(errorHistory));
                renderHistory();
                renderCharts();
            }
        }

        function clearLocalHistory() {
            if(confirm('모든 로컬 오답 기록을 삭제하시겠습니까?')) {
                errorHistory = [];
                localStorage.removeItem('errorHistory');
                renderHistory();
                renderCharts();
            }
        }

        function renderCharts() {
            const total = errorHistory.length;
            document.getElementById('statTotalExams').innerText = total;

            if (total === 0) {
                document.getElementById('statAvgScore').innerText = '0점';
                document.getElementById('statTopCause').innerText = '-';
                if(causeChartInstance) causeChartInstance.destroy();
                if(subjectChartInstance) subjectChartInstance.destroy();
                return;
            }

            const avg = (errorHistory.reduce((acc, curr) => acc + Number(curr.score), 0) / total).toFixed(1);
            document.getElementById('statAvgScore').innerText = avg + '점';

            const causeCounts = {};
            errorHistory.forEach(item => {
                causeCounts[item.cause] = (causeCounts[item.cause] || 0) + 1;
            });

            let topCause = '-';
            let maxCount = 0;
            for (let c in causeCounts) {
                if (causeCounts[c] > maxCount) {
                    maxCount = causeCounts[c];
                    topCause = c;
                }
            }
            document.getElementById('statTopCause').innerText = topCause;

            const subjectScores = {};
            const subjectCounts = {};
            errorHistory.forEach(item => {
                subjectScores[item.subject] = (subjectScores[item.subject] || 0) + Number(item.score);
                subjectCounts[item.subject] = (subjectCounts[item.subject] || 0) + 1;
            });

            const subjectAvgs = {};
            for (let s in subjectScores) {
                subjectAvgs[s] = (subjectScores[s] / subjectCounts[s]).toFixed(1);
            }

            const ctxCause = document.getElementById('causeChart').getContext('2d');
            if (causeChartInstance) causeChartInstance.destroy();
            causeChartInstance = new Chart(ctxCause, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(causeCounts),
                    datasets: [{
                        data: Object.values(causeCounts),
                        backgroundColor: ['#EF4444', '#F59E0B', '#3B82F6', '#10B981', '#8B5CF6', '#EC4899', '#6B7280']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom' },
                        title: { display: true, text: '오답 원인 분포' }
                    }
                }
            });

            const ctxSubject = document.getElementById('subjectChart').getContext('2d');
            if (subjectChartInstance) subjectChartInstance.destroy();
            subjectChartInstance = new Chart(ctxSubject, {
                type: 'bar',
                data: {
                    labels: Object.keys(subjectAvgs),
                    datasets: [{
                        label: '평균 점수',
                        data: Object.values(subjectAvgs),
                        backgroundColor: '#4F46E5'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: { y: { min: 0, max: 100 } },
                    plugins: { legend: { display: false } }
                }
            });
        }
    </script>
</body>
</html>
